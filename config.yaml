# Portfolio Risk Management & Volatility Forecasting Configuration

tickers:
  - AAPL
  - MSFT
  - NVDA
  - SPY
  - QQQ

data:
  start_date: "2020-01-01"
  lookback_days: 252

risk:
  confidence_levels:
    - 0.95
    - 0.99
  monte_carlo_simulations: 5000
  horizon_days: 1

model:
  sequence_length: 30
  epochs: 15
  batch_size: 32
  train_split: 0.8
  learning_rate: 0.001

backtest:
  initial_capital: 100000.0
  target_volatility: 0.15
  risk_free_rate: 0.04
